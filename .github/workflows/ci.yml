name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Rust gate(對齊 codex review 跑的 4 條)───
  rust:
    name: Rust fmt / check / clippy / test
    runs-on: ubuntu-latest

    # sqlx::query!() 需要 schema 來源:CI 起 postgres service container,
    # migration 後跑 `cargo sqlx prepare --check` 驗 .sqlx/ offline cache 沒 drift,再 build。
    # (.sqlx/ demo 已 commit,見 §0.5 / CLAUDE.md;Docker image build 也靠這份 cache)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d demo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/demo

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target + installed binaries
        uses: Swatinem/rust-cache@v2

      - name: cargo fetch (download deps once)
        run: cargo fetch --locked

      - name: Install sqlx-cli (rustls + postgres only)
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked

      - name: Run migrations against service postgres
        run: sqlx migrate run

      - name: Verify .sqlx offline cache not drifted
        run: cargo sqlx prepare --check --workspace

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # ─── Secret scan(每個 push / PR 都 gate)───
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 抓全 history,讓 gitleaks 掃所有 commit

      - name: gitleaks-action
        uses: gitleaks/gitleaks-action@v2
