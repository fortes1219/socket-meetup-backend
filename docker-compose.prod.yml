name: socket-meetup-prod

services:
  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:?FRONTEND_BUILD_CONTEXT required}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  rust-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN required}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,socketioxide=warn,engineioxide=warn}
      BINANCE_REST_BASE: ${BINANCE_REST_BASE:-https://api.binance.com}
      BINANCE_WS_BASE: ${BINANCE_WS_BASE:-wss://stream.binance.com:9443}
      BINANCE_KLINE_SYMBOLS: ${BINANCE_KLINE_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,SHIBUSDT}
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
