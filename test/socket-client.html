<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO test — socket-meetup-backend</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
    .ok { color: #2a7; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Socket.IO test — <code>/quote</code></h1>
  <p>F12 開 console,預期依序看到:</p>
  <ol>
    <li>立刻:<code>[/quote] connected: &lt;socket-id&gt;</code></li>
    <li>等 ≤ 60 秒:<code>[/quote] kline:closed { symbol, interval, open, high, low, close, volume, open_time, close_time }</code>(BTCUSDT 1m,每分鐘一次)</li>
  </ol>
  <p id="status">Status: <span id="state">connecting...</span></p>

  <script>
    const $ = (id) => document.getElementById(id);
    const quote = io("/quote");

    quote.on("connect", () => {
      console.log("[/quote] connected:", quote.id);
      $("state").innerHTML = '<span class="ok">connected ' + quote.id + '</span>';
    });
    quote.on("disconnect", (reason) => {
      console.log("[/quote] disconnected:", reason);
      $("state").textContent = "disconnected: " + reason;
    });
    quote.on("kline:closed", (k) => {
      console.log("[/quote] kline:closed", k);
    });
  </script>
</body>
</html>
